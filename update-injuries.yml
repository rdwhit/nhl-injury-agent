# Reads the CBS NHL injury report every 3 hours, 30 minutes before each admin update. No skipping: every scheduled run is a real update.
# (Times are fixed in UTC, so after daylight saving ends they happen an hour earlier in Eastern.)

name: Update NHL injuries

on:
  schedule:
    - cron: "30 0,3,6,9,12,15,18,21 * * *"   # Reads the CBS NHL injury report every 3 hours, 30 minutes before each admin update
  workflow_dispatch:   # "Run workflow" button: always runs, any time

permissions:
  contents: write

concurrency:
  group: update-nhl-injuries
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Get the repo files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run the injury agent
        run: python update_injuries.py

      - name: Save updated data
        run: |
          git config user.name "nhl-injury-agent"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes to save."
          else
            git commit -m "NHL injury update $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
